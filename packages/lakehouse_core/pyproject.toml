[project]
name = "lakehouse-core"
requires-python = ">=3.12,<3.15"
version = "0.2.0"
description = "The parts of the lakehouse that know no domain: bronze, paths and manifests."
authors = [{ name = "Lionel Peer" }]
license = "MIT"
dependencies = [
    "dagster==1.13.21",
    "httpx>=0.28.1",
    "pyarrow>=17.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-core"
requires-python = ">=3.12,<3.15"
version = "0.3.0"
description = "The parts of the lakehouse that know no domain: bronze, paths and manifests."
authors = [{ name = "Lionel Peer" }]
license = "MIT"
dependencies = [
    "adlfs>=2024.12",
    "dagster==1.13.21",
    "duckdb>=1.2.2,<1.6",
    "fsspec>=2025.1",
    "gcsfs>=2025.1",
    "httpx>=0.28.1",
    "pyarrow>=17.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "s3fs>=2025.1",
    "universal-pathlib>=0.3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Run the checks, and prove that the images still build.
#
# Nothing here reaches a registry. `release.yml` publishes. A broken Dockerfile then
# fails on the change that broke it, not on a release that has already tagged.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # A called workflow's check is reported as `<caller job> / <called job>`, and
  # `checks / check` is the name that the ruleset on `main` requires. Renaming either
  # half leaves the ruleset waiting on a check that nobody produces.
  checks:
    uses: ./.github/workflows/checks.yml

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      triton: ${{ steps.filter.outputs.triton }}
      studio: ${{ steps.filter.outputs.studio }}
      studio-lock: ${{ steps.filter.outputs.studio-lock }}
    steps:
      - uses: actions/checkout@v7
      # The base images in triton/base build on a local machine, not here.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            triton:
              - 'triton/**'
              - '!triton/base/**'
            studio:
              - 'studio/**'
            # studio shares the lock of the workspace.
            studio-lock:
              - 'uv.lock'
              - 'pyproject.toml'

  app-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The gha cache needs a buildx builder. The release build reads the same scope.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: domains/cv/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  # The tritonserver bases are about 20 GB, so this runs only when `triton/` changes. The
  # images are larger than the 10 GB gha cache, so they build without one.
  triton-image:
    needs: changes
    if: needs.changes.outputs.triton == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [cuda, rocm]
    steps:
      # The base images are about 12 GB, close to what a runner has free. The removal of
      # the large apt packages takes minutes, and the images do not need it.
      - uses: jlumbroso/free-disk-space@v2
        with:
          large-packages: false
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: triton
          file: triton/Dockerfile.${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          provenance: false

  # The sync writes LightlyStudio tables, so its tests run against a real Postgres with
  # pgvector, which they start with Docker. A change to the lock changes their versions,
  # so it runs them too. The image builds from upstream, and the lock does not touch it.
  studio-test:
    needs: changes
    if: >-
      needs.changes.outputs.studio == 'true'
      || needs.changes.outputs.studio-lock == 'true'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: make -C studio test

  studio-image:
    needs: changes
    if: needs.changes.outputs.studio == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [gui, sync]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: studio
          target: ${{ matrix.target }}
          push: false
          provenance: false
          cache-from: type=gha,scope=studio-${{ matrix.target }}
          cache-to: type=gha,scope=studio-${{ matrix.target }},mode=max

services:
  triton-server:
    # A released image by default. `make up` builds this checkout instead, as the `dev`
    # tag. Pin TRITON_VERSION to an X.Y.Z release in production.
    image: ghcr.io/liopeer/cv_lakehouse-triton:${TRITON_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-lakehouse-triton
    command: ["--log-verbose=1"]
    ports:
      - "8010:8000"  # HTTP
      - "8011:8001"  # gRPC
      - "8012:8002"  # Metrics
    volumes:
      # The engines that the first start builds, per image version and GPU.
      - triton-cache:/cache
      # Silver sends IMAGE_PATH, so the lake must resolve at the same absolute path
      # inside the container. A bronze directory symlinked to somewhere outside the
      # root needs a mount of its own here.
      - ${CV_LAKEHOUSE_ROOT:?set CV_LAKEHOUSE_ROOT to an absolute path}:${CV_LAKEHOUSE_ROOT}:ro
    # Python-backend BLS sub-requests each allocate their own shared-memory
    # region; the 64MB docker default is exhausted quickly under concurrent
    # fan-out (see mobileclip_s0/1/model.py's per-image sub-request semaphore).
    shm_size: '2gb'
    # The first start builds the engines, which takes minutes. Only then does Triton
    # listen.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  triton-cache:

# One service for each image. Start one with its profile, such as
# `docker compose --profile rocm up -d`. `make up` picks the profile for this host.
x-triton-server: &triton-server
  command: ["--log-verbose=1"]
  ports:
    - "8010:8000"  # HTTP
    - "8011:8001"  # gRPC
    - "8012:8002"  # Metrics
  volumes:
    # The models that the first start builds, per image version, platform and GPU.
    - triton-cache:/cache
    # Silver sends IMAGE_PATH, so the lake must resolve at the same absolute path
    # inside the container. A bronze directory symlinked to somewhere outside the
    # root needs a mount of its own here.
    #
    # The daemon runs as root, so a missing source becomes a lake root that the host
    # user cannot write. The lake belongs to the host user, so the mount refuses to
    # create it, and compose reports the missing path instead.
    - type: bind
      source: ${CV_LAKEHOUSE_ROOT:?set CV_LAKEHOUSE_ROOT to an absolute path}
      target: ${CV_LAKEHOUSE_ROOT}
      read_only: true
      bind:
        create_host_path: false
  # Python-backend BLS sub-requests each allocate their own shared-memory
  # region; the 64MB docker default is exhausted quickly under concurrent
  # fan-out (see mobileclip_s0/1/model.py's per-image sub-request semaphore).
  shm_size: '2gb'
  # The first start builds the models, which takes minutes. On ROCm, MIGraphX then
  # compiles them when Triton loads them, which takes longer. Only then does Triton
  # listen.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "localhost:8000/v2/health/ready"]
    interval: 30s
    timeout: 5s
    start_period: 60m
  restart: unless-stopped

services:
  # A released image by default. `make up` builds this checkout instead, as the `dev`
  # tag. Pin TRITON_VERSION to an X.Y.Z release in production.
  triton-cuda:
    <<: *triton-server
    profiles: [cuda]
    image: ghcr.io/liopeer/cv_lakehouse-triton:${TRITON_VERSION:-dev}-cuda
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: cv-lakehouse-triton-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  triton-rocm:
    <<: *triton-server
    profiles: [rocm]
    image: ghcr.io/liopeer/cv_lakehouse-triton:${TRITON_VERSION:-dev}-rocm
    build:
      context: .
      dockerfile: Dockerfile.rocm
    container_name: cv-lakehouse-triton-rocm
    devices:
      - /dev/kfd
      - /dev/dri
    # The render group owns /dev/kfd. The image has no render group, so compose needs
    # the ID on the host. `make up` sets RENDER_GID to it.
    #
    # Compose interpolates this file for every profile, so a required variable here
    # breaks a cuda run too. The fallback names the fix instead, and the daemon prints
    # it as the group that it cannot find.
    group_add:
      - video
      - ${RENDER_GID:-RENDER_GID-is-unset-run-make-up}
    security_opt:
      - seccomp=unconfined

volumes:
  triton-cache:

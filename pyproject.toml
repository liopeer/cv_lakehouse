# The workspace root. It is no package of its own: the packages are the members.

[tool.uv.workspace]
members = ["packages/lakehouse_core", "domains/cv", "studio"]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "licenseheaders>=0.8.8",
    "moto[server]>=5.1",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

# Nothing here trains or embeds. Triton computes the embeddings, and studio only embeds
# a search query, so the CPU channel saves 2.8 GB of wheels on Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.dg]
directory_type = "workspace"

[[tool.dg.workspace.projects]]
path = "domains/cv"

[tool.ruff]
src = [
    "packages/lakehouse_core/src",
    "domains/cv/src",
    "studio/src",
    "tests",
    "packages/lakehouse_core/tests",
    "domains/cv",
    "studio",
]
# Vendored from liopeer/lightly-studio, and from Apple under it. Ours to run, not to
# reformat.
extend-exclude = ["triton"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["lakehouse_core", "lakehouse_cv", "cv_lakehouse_studio"]

[tool.pyrefly]
project-includes = [
    "packages/lakehouse_core/src",
    "packages/lakehouse_core/tests",
    "domains/cv/src",
    "domains/cv/tests",
    "studio/src",
    "tests",
]
search-path = [
    "packages/lakehouse_core/src",
    "domains/cv/src",
    "studio/src",
    "domains/cv",
]
python-version = "3.12"

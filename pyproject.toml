[project]
name = "cv_lakehouse"
requires-python = ">=3.12,<3.15"
version = "0.2.0"
description = "A medallion lakehouse for computer vision datasets, built on Dagster."
authors = [{ name = "Lionel Peer" }]
license = "MIT"
dependencies = [
    "dagster==1.13.21",
    "duckdb>=1.2.2,<1.6",
    "httpx>=0.28.1",
    "labelformat>=0.1.17",
    "pillow>=12.3.0",
    "pyarrow>=17.0.0",
    "pydantic-settings>=2.15.0",
    "tritonclient[grpc]>=2.72.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    # For `tools/studio.py` and the test that loads silver through it. The package
    # itself needs no GUI, so this is the only reason the three are installed here.
    # torch and torchvision are direct because uv routes an index only for a direct
    # dependency, and nothing here trains, so this takes the CPU wheels.
    "lightly-studio>=1.1.1",
    "torch>=2.6.0",
    "torchvision>=0.20.0",
    "licenseheaders>=0.8.8",
]

# Nothing here trains or embeds. A separate service computes the embeddings, so no
# install of ours needs CUDA, and the CPU channel saves 2.8 GB of wheels on Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "cv_lakehouse"
registry_modules = [
    "cv_lakehouse.components.*",
]

[tool.ruff]
src = ["src", "tests", "tools"]
# Vendored from liopeer/lightly-studio, and from Apple under it. Ours to run, not to
# reformat.
extend-exclude = ["triton"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pyrefly]
project-includes = ["src", "tests", "tools"]
search-path = ["src", "tools", "."]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tools/studio.py` is a script, not a package module. The test that loads silver
# through it imports it from here, so a schema change in either is caught by `make
# check` rather than by a broken GUI.
pythonpath = ["tools"]
